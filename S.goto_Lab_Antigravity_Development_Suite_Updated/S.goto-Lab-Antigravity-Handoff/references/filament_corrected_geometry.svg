    <path d="M25 105 C280 105 335 180 650 180" stroke="#b9b3a9"/>
    <path d="M25 180 H650" stroke="#d6d0c7"/>
    <path d="M25 255 C280 255 335 180 650 180" stroke="#b9b3a9"/>
    <path d="M25 335 C270 335 315 180 650 180" stroke="#8f8a82"/>
